name: Release

# Push 一个 v* tag（如 v0.1.0）自动构建多平台安装包并发布到 GitHub Releases
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {} # 允许手动触发（构建但不发布，用于验证流程）

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon (arm64)
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest # Intel (x86_64)
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 Rust（stable）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust 编译缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.platform }}-${{ matrix.args }}

      - name: 安装 Linux 构建依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libxdo-dev

      - name: 同步 Node 依赖
        run: npm ci

      - name: 构建并发布（tag 触发时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "AgentHub ${{ github.ref_name }}"
          releaseBody: "安装包见下方 Assets。macOS 提供 dmg（arm64 / x64），Windows 提供 msi / nsis，Linux 提供 deb / AppImage / rpm。"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # 手动触发（workflow_dispatch）时只构建、不创建 release，
      # 安装包保留在本次运行产物（Artifacts）里供下载验证
      - name: 仅构建（手动触发时上传 Artifacts）
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
